<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-label="aigc-video 怎么工作：查经验定类型、镜头表、写全文、自动检查、即梦生成、成片发回、逐句对照、记进经验库">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1418"/>
      <stop offset="0.6" stop-color="#12222a"/>
      <stop offset="1" stop-color="#1b1712"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9fb4bb"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f2b84b"/>
    </marker>
    <style>
      .t{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#f4efe6;font-size:20px;font-weight:600}
      .s{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#a9bcc2;font-size:14px}
      .n{font-family:Consolas,'SF Mono',Menlo,monospace;fill:#7f959c;font-size:13px;letter-spacing:1px}
      .ng{font-family:Consolas,'SF Mono',Menlo,monospace;fill:#f2b84b;font-size:13px;letter-spacing:1px}
      .row{font-family:'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#7f959c;font-size:13px;letter-spacing:2px}
      .box{fill:#0f1c22;stroke:#35505a;stroke-width:1.5}
      .gold{fill:#1c1a12;stroke:#f2b84b;stroke-width:2}
      .ln{stroke:#9fb4bb;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="960" height="500" rx="0" fill="url(#bg)"/>

  <!-- 入口 -->
  <text x="40" y="58" class="t" style="font-size:17px;font-weight:500">你说一句想法，带上素材</text>
  <text x="920" y="58" class="n" text-anchor="end">aigc-video · 怎么工作</text>
  <path d="M135 72 V124" class="ln" marker-end="url(#ar)"/>

  <!-- 第一行：写稿（左→右） -->
  <rect x="40"  y="130" width="190" height="96" class="box"/>
  <rect x="270" y="130" width="190" height="96" class="gold"/>
  <rect x="500" y="130" width="190" height="96" class="box"/>
  <rect x="730" y="130" width="190" height="96" class="box"/>
  <text x="56"  y="156" class="n">01</text><text x="56"  y="186" class="t">查经验，定类型</text><text x="56"  y="210" class="s">对话 · 快动作 · 白模</text>
  <text x="286" y="156" class="ng">02</text><text x="286" y="186" class="t">镜头表</text><text x="286" y="210" class="s" style="fill:#f2d9a6">你改，你点头</text>
  <text x="516" y="156" class="n">03</text><text x="516" y="186" class="t">写全文</text><text x="516" y="210" class="s">主体 · 场景 · 风格 · 情节</text>
  <text x="746" y="156" class="n">04</text><text x="746" y="186" class="t">自动检查</text><text x="746" y="210" class="s">格式 · 素材 · 坏写法</text>
  <path d="M230 178 H266" class="ln" marker-end="url(#ar)"/>
  <path d="M460 178 H496" class="ln" marker-end="url(#ar)"/>
  <path d="M690 178 H726" class="ln" marker-end="url(#ar)"/>

  <!-- 转下行 -->
  <path d="M825 226 V326" class="ln" marker-end="url(#ar)"/>
  <text x="838" y="282" class="s">拿去即梦</text>

  <!-- 第二行：成片（右→左） -->
  <rect x="730" y="330" width="190" height="96" class="box"/>
  <rect x="500" y="330" width="190" height="96" class="box"/>
  <rect x="270" y="330" width="190" height="96" class="box"/>
  <rect x="40"  y="330" width="190" height="96" class="gold"/>
  <text x="746" y="356" class="n">05</text><text x="746" y="386" class="t">即梦生成</text><text x="746" y="410" class="s">你来跑</text>
  <text x="516" y="356" class="n">06</text><text x="516" y="386" class="t">成片发回</text><text x="516" y="410" class="s">抽帧看画面</text>
  <text x="286" y="356" class="n">07</text><text x="286" y="386" class="t">逐句对照</text><text x="286" y="410" class="s">哪句没拍出来，为什么</text>
  <text x="56"  y="356" class="ng">08</text><text x="56"  y="386" class="t">记进经验库</text><text x="56"  y="410" class="s" style="fill:#f2d9a6">你同意才记</text>
  <path d="M730 378 H694" class="ln" marker-end="url(#ar)"/>
  <path d="M500 378 H464" class="ln" marker-end="url(#ar)"/>
  <path d="M270 378 H234" class="ln" marker-end="url(#ar)"/>

  <!-- 回到 01 -->
  <path d="M135 330 V230" fill="none" stroke="#f2b84b" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#arg)"/>
  <text x="150" y="284" class="s" style="fill:#f2d9a6">下次写稿先查</text>

  <!-- 图例 -->
  <rect x="40" y="458" width="14" height="14" class="gold"/>
  <text x="64" y="470" class="s">金框：要你拍板的地方</text>
  <text x="920" y="470" class="n" text-anchor="end">经验库 122 条 · 规则都有成片或官方依据</text>
</svg>
